<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Letter Pack Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0055a3" />
      <stop offset="50%" stop-color="#004485" />
      <stop offset="100%" stop-color="#002b57" />
    </linearGradient>

    <!-- Header Blue Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005bab" />
      <stop offset="100%" stop-color="#0070d1" />
    </linearGradient>

    <!-- Red Accent Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f03237" />
      <stop offset="100%" stop-color="#c2171c" />
    </linearGradient>

    <!-- Blue X Gradient -->
    <linearGradient id="blueXGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066bf" />
      <stop offset="100%" stop-color="#003d75" />
    </linearGradient>

    <!-- Clip for Rounded App Icon -->
    <clipPath id="iconClip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112" />
    </clipPath>

    <!-- Clip for Envelope Card -->
    <clipPath id="cardClip">
      <rect x="52" y="48" width="408" height="416" rx="34" ry="34" />
    </clipPath>
  </defs>

  <g clip-path="url(#iconClip)">
    <!-- App Icon Base Background -->
    <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)" />

    <!-- Subtle Decorative Background Grid -->
    <g opacity="0.07" stroke="#ffffff" stroke-width="2">
      <line x1="0" y1="128" x2="512" y2="128" />
      <line x1="0" y1="256" x2="512" y2="256" />
      <line x1="0" y1="384" x2="512" y2="384" />
      <line x1="128" y1="0" x2="128" y2="512" />
      <line x1="256" y1="0" x2="256" y2="512" />
      <line x1="384" y1="0" x2="384" y2="512" />
    </g>

    <!-- Envelope Card Drop Shadow (Librsvg safe) -->
    <rect x="52" y="60" width="408" height="416" rx="34" ry="34" fill="#00162e" opacity="0.45" />

    <!-- Main Letter Pack White Envelope Card -->
    <rect x="52" y="48" width="408" height="416" rx="34" ry="34" fill="#ffffff" />

    <g clip-path="url(#cardClip)">
      <!-- Top Blue Header Band (Letter Pack Light Ribbon) -->
      <rect x="52" y="48" width="408" height="62" fill="url(#headerGrad)" />
      <!-- Header White Micro Stripe -->
      <rect x="52" y="103" width="408" height="3" fill="#ffffff" opacity="0.88" />

      <!-- Top Perforation / Fold Dashed Line -->
      <line x1="74" y1="128" x2="438" y2="128" stroke="#5b82b8" stroke-width="3.5" stroke-dasharray="9 6" />

      <!-- Stamp Box (Top Left) -->
      <rect x="78" y="146" width="72" height="86" rx="7" fill="#eef5fc" stroke="#005bab" stroke-width="4.5" />
      <rect x="88" y="156" width="52" height="14" rx="2.5" fill="#005bab" />
      <text x="114" y="200" font-family="'DejaVu Sans', 'Arial Black', sans-serif" font-size="23" font-weight="900" fill="#005bab" text-anchor="middle">430</text>
      <rect x="88" y="212" width="52" height="8" rx="2" fill="#5b82b8" opacity="0.65" />

      <!-- 7-Digit Red Postal Code Boxes (Top Right) -->
      <g transform="translate(170, 150)">
        <!-- First 3 digits (Red thick boxes) -->
        <rect x="0" y="0" width="32" height="42" rx="4.5" fill="#fff5f5" stroke="#d7262b" stroke-width="5" />
        <rect x="39" y="0" width="32" height="42" rx="4.5" fill="#fff5f5" stroke="#d7262b" stroke-width="5" />
        <rect x="78" y="0" width="32" height="42" rx="4.5" fill="#fff5f5" stroke="#d7262b" stroke-width="5" />
        <!-- Hyphen -->
        <rect x="116" y="18" width="10" height="6" rx="2" fill="#d7262b" />
        <!-- Last 4 digits (Red boxes) -->
        <rect x="132" y="3" width="28" height="36" rx="4" fill="#fff5f5" stroke="#d7262b" stroke-width="3.6" />
        <rect x="166" y="3" width="28" height="36" rx="4" fill="#fff5f5" stroke="#d7262b" stroke-width="3.6" />
        <rect x="200" y="3" width="28" height="36" rx="4" fill="#fff5f5" stroke="#d7262b" stroke-width="3.6" />
        <rect x="234" y="3" width="28" height="36" rx="4" fill="#fff5f5" stroke="#d7262b" stroke-width="3.6" />
      </g>

      <!-- Address Table Outer Frame (Letter Pack Light Blue Frame) -->
      <rect x="78" y="248" width="356" height="162" rx="12" fill="#f5f9ff" stroke="#005bab" stroke-width="5.5" />
      <!-- Left Blue Sidebar ("To" Column) -->
      <path d="M 90 248 H 138 V 410 H 90 Q 78 410 78 398 V 260 Q 78 248 90 248 Z" fill="#005bab" />
      <!-- Upward White Delivery Arrow inside Sidebar -->
      <path d="M 108 272 L 91 296 H 101 V 356 H 115 V 296 H 125 Z" fill="#ffffff" />
      <rect x="101" y="365" width="14" height="6" fill="#ffffff" opacity="0.88" />
      <rect x="101" y="377" width="14" height="6" fill="#ffffff" opacity="0.6" />

      <!-- Horizontal Address Guide Lines -->
      <line x1="158" y1="292" x2="310" y2="292" stroke="#9ab8dc" stroke-width="6" stroke-linecap="round" />
      <line x1="158" y1="330" x2="285" y2="330" stroke="#9ab8dc" stroke-width="6" stroke-linecap="round" />
      <line x1="158" y1="370" x2="265" y2="370" stroke="#005bab" stroke-width="8" stroke-linecap="round" opacity="0.45" />

      <!-- Bottom Red Warning Line & Blue Stripe -->
      <rect x="52" y="428" width="408" height="12" fill="#d7262b" />
      <rect x="52" y="440" width="408" height="24" fill="#005bab" />
    </g>

    <!-- Envelope Card Outer Crisp Border -->
    <rect x="52" y="48" width="408" height="416" rx="34" ry="34" fill="none" stroke="#ffffff" stroke-width="3" />

    <!-- Top Brand Text "letapaX" in Blue Header Ribbon -->
    <text x="256" y="89" font-family="'DejaVu Sans', system-ui, -apple-system, sans-serif" font-size="33" font-weight="900" fill="#ffffff" letter-spacing="2" text-anchor="middle">letapa<tspan fill="#ffccd0">X</tspan></text>

    <!-- Dynamic "X" Emblem Badge (Bottom Right Overlapping Seal) -->
    <g transform="translate(262, 248)">
      <!-- Badge Drop Shadow -->
      <circle cx="114" cy="122" r="100" fill="#001833" opacity="0.38" />
      <!-- White Halo Shield behind X -->
      <circle cx="114" cy="114" r="98" fill="#ffffff" stroke="#005bab" stroke-width="7" />
      <!-- Inner subtle blue tint ring -->
      <circle cx="114" cy="114" r="84" fill="#eef5fc" />

      <!-- Stylized Bold "X" combining Letter Pack Blue and Postal Red -->
      <!-- Back-slash bar (Top-Left to Bottom-Right: Deep Letter Pack Blue) -->
      <g transform="translate(114, 114) rotate(-40)">
        <rect x="-18" y="-68" width="36" height="136" rx="14" fill="url(#blueXGrad)" />
      </g>

      <!-- Forward-slash bar (Top-Right to Bottom-Left: Postal Red Accent with White Knockout Border) -->
      <g transform="translate(114, 114) rotate(40)">
        <rect x="-21" y="-71" width="42" height="142" rx="16" fill="#eef5fc" />
        <rect x="-18" y="-68" width="36" height="136" rx="14" fill="url(#redGrad)" />
      </g>
    </g>
  </g>
</svg>
